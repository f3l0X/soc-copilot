name: soc-copilot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: ../.env
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    logging: *default-logging
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      CHROMA_HOST: chroma
    ports:
      - "8080:8080"
    volumes:
      - ../apps/api/app:/code/app
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  web:
    build:
      context: ../apps/web
      target: dev
    restart: unless-stopped
    logging: *default-logging
    env_file: ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_API_URL: http://api:8080
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "13000:3000"
    volumes:
      - ../apps/web/src:/app/src
      - ../apps/web/public:/app/public
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
  chroma-data:
