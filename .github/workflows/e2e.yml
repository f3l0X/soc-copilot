name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-e2e:
    name: API end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_ci_pw
          POSTGRES_DB: soc_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc -d soc_copilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      # Run migrations as a separate step so a schema failure surfaces clearly
      # instead of getting buried in pytest output via the app's lifespan.
      - name: Apply DB migrations
        working-directory: apps/api
        run: alembic upgrade head
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_ci_pw
          POSTGRES_DB: soc_copilot
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
      - name: Verify models match migrations
        working-directory: apps/api
        run: alembic check
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_ci_pw
          POSTGRES_DB: soc_copilot
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
      - name: Run E2E tests
        working-directory: apps/api
        run: pytest tests/test_e2e.py tests/test_migrations.py -v
        env:
          RUN_E2E: "1"
          APP_ENV: development
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_ci_pw
          POSTGRES_DB: soc_copilot
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          JWT_SECRET: test-secret-32+chars-please-12345678
          APP_ENCRYPTION_KEY: m24ERtIpLGYhHLZ_TeXqXnXRUZ9GlMM_hwdPTSCDPQM=
          GEMINI_API_KEY: fake
          RATE_LIMIT_ENABLED: "false"
