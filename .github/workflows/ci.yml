name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app
      - run: python -c "from app.main import app; print(app.title)"
      - run: pytest -q
        env:
          GEMINI_API_KEY: dummy_for_ci_no_real_calls

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_ci_pw
          POSTGRES_DB: soc_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc -d soc_copilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_e2e.py
        env:
          RUN_E2E: "1"
          GEMINI_API_KEY: dummy_for_ci_no_real_calls
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc_ci_pw
          POSTGRES_DB: soc_copilot
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          JWT_SECRET: ci-only-jwt-secret-ignore-this

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
