name: CI

on:
  push:
  pull_request:

jobs:
  api-lint-test:
    name: API lint & test
    runs-on: ubuntu-latest
    # Some smoke tests hit endpoints that persist via SQLAlchemy/psycopg
    # (e.g. /api/chat). A real Postgres makes them deterministic without
    # having to mock the DbSession in every test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: soc_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U soc -d soc_copilot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ci_only_not_a_real_secret
      POSTGRES_DB: soc_copilot
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      GEMINI_API_KEY: dummy_for_ci_no_real_calls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check apps/api
      # NOTE: `ruff format --check` deliberately omitted — the existing
      # codebase isn't ruff-formatted yet. Run `ruff format apps/api` in
      # a dedicated PR and add this step back once the diff is in.
      - name: Alembic upgrade head
        working-directory: apps/api
        run: alembic upgrade head
      - name: Pytest (smoke, no e2e)
        working-directory: apps/api
        run: pytest --ignore=tests/test_e2e.py -v

  web-lint-build:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Surface high/critical CVEs without failing the pipeline — upstream
      # advisories on transitive deps shouldn't block merging unrelated work.
      - name: npm audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8080

  infra-validate:
    name: Infra compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml references `../.env`; create a stub from the
      # example so `compose config` can resolve env_file paths.
      - name: Stub .env for compose validation
        run: cp .env.example .env
      - name: Validate dev compose
        run: docker compose -f infra/docker-compose.yml config -q
      - name: Validate prod example compose
        run: docker compose -f infra/docker-compose.prod.example.yml config -q
        env:
          PUBLIC_DOMAIN: example.com
          ACME_EMAIL: a@b.c
